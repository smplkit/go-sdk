# Dependabot for go-sdk.
#
# Every dependency bump is a `fix:` — a version change is a real
# change to the release inputs and warrants a new patch publish via
# semantic-release. Per the SDK commit-message lockdown in
# ~/.claude/CLAUDE.md, `fix:` is the maximum bump permitted.
#
# All gomod deps go in one weekly group (Go modules don't split
# production / development the way npm or pyproject do). Major
# bumps land as individual PRs.
#
# Patch + minor bumps auto-merge on green CI via the sibling
# .github/workflows/dependabot-auto-merge.yml workflow.

version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
    open-pull-requests-limit: 10
    # SDK floor protection. gomod supports no `versioning-strategy`, and
    # Go's Minimal Version Selection makes every `require` a customer-facing
    # floor (the consumer's build resolves to the MAX of their version and
    # ours). Freeze the runtime-reachable direct deps so Dependabot cannot
    # raise the floor we publish. `update-types` ignores suppress only
    # scheduled VERSION updates — Dependabot SECURITY updates still flow,
    # so CVEs in these libraries (e.g. the HTTP runtime) still surface.
    # testify is intentionally NOT frozen: it's the test framework, its
    # floor is immaterial to real consumers, and keeping it current is
    # beneficial. When adding a new customer-facing dep, add it here too.
    ignore:
      - dependency-name: "github.com/oapi-codegen/runtime"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "github.com/diegoholiveira/jsonlogic/v3"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "github.com/google/uuid"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
    groups:
      gomod:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      actions:
        update-types:
          - minor
          - patch
